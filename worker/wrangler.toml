name = "strava-mini"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# KV namespace used to store the single-athlete Strava token set.
# Create it with:  wrangler kv namespace create STRAVA_MINI_TOKENS
# then paste the returned id below.
kv_namespaces = [
  { binding = "STRAVA_MINI_TOKENS", id = "ff333e9eeab84c3cb21d2e1ba8f3d1a4" }
]

[vars]
# Your Strava API application's Client ID (safe to expose, it's public).
STRAVA_CLIENT_ID = "137524"

# The full URL where your frontend is actually hosted, including a path
# if it's a GitHub Pages project site (e.g. https://you.github.io/repo-name)
# rather than a user page at the domain root. Used both for redirecting
# back after login (uses the full value) and for CORS (the worker
# automatically derives just the origin from this, since browsers never
# send a path in the Origin header). No trailing slash.
FRONTEND_URL = "https://nmanjuonline.github.io/strava-mini"

# Secrets (never put these here) — set with:
#   wrangler secret put STRAVA_CLIENT_SECRET
#   wrangler secret put APP_SECRET
#
# STRAVA_CLIENT_SECRET: from your Strava API application settings.
# APP_SECRET: a password you make up yourself. It gates access to this
#             worker so random visitors can't drive your Strava account
#             through it. Put the same value in the frontend when prompted.

# Live request/error logs, viewable in the Cloudflare dashboard under
# Workers -> your worker -> Logs. Handy for debugging without needing
# `wrangler tail` running locally.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
